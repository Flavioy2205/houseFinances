version: '3.8'

services:
  # Container do Banco de Dados PostgreSQL 15
  postgres:
    image: postgres:15-alpine
    container_name: housefinances_postgres
    restart: always
    environment:
      POSTGRES_DB: housefinances
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d housefinances"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API REST Automática para o PostgreSQL (Permite o aplicativo React salvar direto no Postgres)
  api:
    image: postgrest/postgrest
    container_name: housefinances_api
    restart: always
    ports:
      - "3002:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:postgrespassword@postgres:5432/housefinances
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: postgres
    depends_on:
      - postgres

  # Painel de Gerenciamento Web pgAdmin 4 (Acesse em http://localhost:5050)
  pgadmin:
    image: dpage/pgadmin4
    container_name: housefinances_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@housefinances.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
